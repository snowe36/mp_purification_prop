[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mp-atlas"
version = "0.1.0"
description = "Leakage-aware HTS funnel for membrane-protein expression vs purification vs structure"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Eric Snow" }]
dependencies = [
  "numpy>=1.24",
  "pandas>=2.0",
  "scikit-learn>=1.3",
  "matplotlib>=3.7",
  "pyarrow>=14.0",
  "requests>=2.31",
  "PyYAML>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=7.4", "ruff>=0.6"]

[project.scripts]
mpx-demo = "mpatlas.demo:main"
mpx-download = "mpatlas.cli:download_main"
mpx-census = "mpatlas.cli:census_main"
mpx-express = "mpatlas.cli:express_main"
mpx-panel = "mpatlas.cli:panel_main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = [".venv", "data", "reports", "demo"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["mpatlas"]
